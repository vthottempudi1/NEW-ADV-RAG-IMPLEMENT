[project]
name = "new-adv-rag-implement"
version = "0.1.0"
description = "Enterprise Advanced RAG implementation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "PyYAML>=6.0.2",
    "openai>=1.54.0",
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    "qdrant-client>=1.12.0",
    "python-multipart>=0.0.12",
    "upstash-redis>=1.2.0",
    "bcrypt>=4.1.0",
    "pyjwt>=2.10.0",
    "psycopg2-binary>=2.9.10",
    "boto3>=1.39.0",
    "loguru>=0.7.2",
    "langgraph>=0.2.50",
    "scikit-learn>=1.5.0",
    "sentence-transformers>=3.3.0",
    "tavily-python>=0.5.0",
    "sqlglot>=26.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx2>=0.28.1",
    "ruff==0.16.9",
    "streamlit>=1.46.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.cache/pytest_tmp"
cache_dir = ".cache/pytest_cache"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["I"]
