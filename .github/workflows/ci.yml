name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: test-key
      TAVILY_API_KEY: test-key
      UPSTASH_REDIS_URL: ""
      UPSTASH_REDIS_TOKEN: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and test dependencies
        run: pip install ".[dev]"

      - name: Lint application, evaluation, UI, scripts, and tests
        run: ruff check app evals scripts ui tests

      - name: Enforce complete learner documentation
        run: python scripts/add_learner_docs.py && git diff --exit-code

      - name: Run tests
        run: pytest -q

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project and audit tool
        run: |
          python -m pip install --upgrade pip
          pip install . pip-audit

      - name: Audit Python dependencies
        run: pip-audit

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@v2.3.9

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Reclaim runner disk for the ML container
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          docker system prune --all --force
          df -h

      - name: Build backend image
        run: docker build --file infra/docker/backend.Dockerfile --tag new-adv-rag-backend:ci .

      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: new-adv-rag-backend:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln
          exit-code: "1"

  eval-smoke:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: naive
            filter: baseline
            output: evals/reports/results/ci_baseline.json
          - profile: hybrid
            filter: hybrid
            output: evals/reports/results/ci_hybrid.json
          - profile: hybrid
            filter: hybrid_rag_sql
            output: evals/reports/results/ci_hybrid_sql.json
          - profile: hybrid+rerank+crag
            filter: crag
            output: evals/reports/results/ci_crag.json
          - profile: naive
            filter: clarification
            output: evals/reports/results/ci_clarification.json
    env:
      OPENAI_API_KEY: test-key
      TAVILY_API_KEY: test-key
      UPSTASH_REDIS_URL: ""
      UPSTASH_REDIS_TOKEN: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and test dependencies
        run: pip install ".[dev]"

      - name: Run eval smoke
        run: >
          python -m evals.runners.run
          --profile "${{ matrix.profile }}"
          --filter "${{ matrix.filter }}"
          --mode fixture
          --scorer heuristic
          --strict
          --min-source-precision 1.0
          --min-source-recall 1.0
          --output "${{ matrix.output }}"

      - name: Upload eval artifact
        uses: actions/upload-artifact@v7
        with:
          name: eval-${{ matrix.filter }}
          path: ${{ matrix.output }}
