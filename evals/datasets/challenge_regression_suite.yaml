  question: "The default ServiceAccount works. Why should I still create a dedicated one and limit its permissions?"
  intent: rag
  golden_sources: [tasks__configure-pod-container__configure-service-account.txt, concepts__security__rbac-good-practices.pdf]
  golden_answer: >
    A dedicated ServiceAccount gives the workload an explicit identity whose RBAC permissions can
    be limited to only required resources and actions. Reusing the default account increases coupling
    and can grant unrelated Pods broader access, contrary to least privilege.
  golden_answer_keywords: [ServiceAccount, RBAC, least privilege, identity]
  demonstrates_feature: self_rag
  expected_baseline: fail
  expected_with_feature: pass
  expected_route: rag
  notes: "[holdout] Security rationale rather than configuration lookup."

- id: q-140
  question: "A team needs external HTTP routing, stable backend discovery, and only ready Pods receiving requests. Which resources cooperate?"
  intent: rag
  golden_sources: [concepts__services-networking__ingress.docx, concepts__services-networking__service.txt, tasks__configure-pod-container__configure-liveness-readiness-startup-probes.docx]
  golden_answer: >
    An Ingress and its controller handle external HTTP routing to a Service. The Service provides
    stable backend discovery and distributes traffic across its endpoints, while readiness probes
    ensure only ready Pods appear as eligible endpoints.
  golden_answer_keywords: [Ingress, Service, readiness probe, endpoints]
  demonstrates_feature: hybrid
  expected_baseline: fail
  expected_with_feature: pass
  expected_route: rag
  notes: "[holdout] Three-resource networking synthesis."
