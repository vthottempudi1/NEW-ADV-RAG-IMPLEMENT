- id: q-106
  question: "The node is short on memory and Kubernetes starts removing Pods. What determines what goes first?"
  intent: rag
  golden_sources: [concepts__scheduling-eviction__node-pressure-eviction.docx]
  golden_answer: >
    Node-pressure eviction reacts to resource pressure such as low available memory. The kubelet
    considers whether Pods exceed requests, Pod priority, and resource usage relative to requests
    when choosing eviction order; QoS and priority therefore affect which Pods are removed first.
  golden_answer_keywords: [node pressure, eviction, priority, memory]
  demonstrates_feature: hybrid
  expected_baseline: fail
  expected_with_feature: pass
  expected_route: rag
  notes: "[development] Troubleshooting paraphrase for eviction behavior."

- id: q-107
  question: "Where should non-secret command-line settings for several Pods live so I can change them independently of the image?"
  intent: rag
  golden_sources: [concepts__configuration__configmap.html, tasks__configure-pod-container__configure-pod-configmap.html]
  acceptable_source_groups:
    - [concepts__configuration__configmap.html, tasks__configure-pod-container__configure-pod-configmap.html]
  golden_answer: >
    Put non-confidential configuration in a ConfigMap and reference it from the Pod as environment
    variables, command arguments, or mounted files. This separates configuration from the image;
    sensitive values should use a Secret instead.
  golden_answer_keywords: [ConfigMap, configuration, Pod, Secret]
  demonstrates_feature: hybrid
  expected_baseline: fail
  expected_with_feature: pass
  expected_route: rag
  notes: "[development] Configuration intent with an explicit confidentiality boundary."

- id: q-108
