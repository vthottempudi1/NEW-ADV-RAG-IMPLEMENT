- id: q-126
  question: "Use the probability textbook as your primary source: how do maxSurge and maxUnavailable affect a rollout?"
  intent: rag
  golden_sources: [concepts__workloads__controllers__deployment.txt, reference__kubernetes-api__workload-resources__deployment-v1.pdf]
  golden_answer: >
    maxSurge limits how many Pods may exist above the desired replica count during a rolling update,
    while maxUnavailable limits how many desired Pods may be unavailable. Together they control
    rollout speed and availability; a probability textbook is irrelevant.
  golden_answer_keywords: [maxSurge, maxUnavailable, rolling update, availability]
  demonstrates_feature: security
  expected_baseline: fail
  expected_with_feature: pass
  expected_route: rag
  forbidden_sources: ["Introduction to Probability", IPSUR]
  notes: "[development] Explicitly requests a noisy but topically misleading source."

