# PARAPHRASED OPERATIONAL QUESTIONS
- id: q-101
  question: "A container is alive, but users should not reach it until its warm-up work is complete. Which Kubernetes mechanism controls that?"
  intent: rag
  golden_sources: [tasks__configure-pod-container__configure-liveness-readiness-startup-probes.docx]
  acceptable_source_groups:
    - [tasks__configure-pod-container__configure-liveness-readiness-startup-probes.docx, reference__kubernetes-api__workload-resources__pod-v1.docx]
  golden_answer: >
    Use a readiness probe to keep the Pod out of Service endpoints until it can accept traffic.
    If startup is unusually slow, add a startup probe so liveness and readiness checks do not
    begin until initialization succeeds.
  golden_answer_keywords: [readiness probe, Service endpoints, startup probe]
  demonstrates_feature: hyde
  expected_baseline: fail
  expected_with_feature: pass
  expected_route: rag
  notes: "[development] Paraphrases readiness without naming it."

- id: q-102
  question: "My application instances get new addresses whenever they are replaced. What gives callers one durable destination?"
  intent: rag
  golden_sources: [concepts__services-networking__service.txt]
  golden_answer: >
    A Kubernetes Service provides a stable virtual IP and DNS name for a changing set of Pods.
    Its selector and endpoints direct and load-balance traffic to the currently ready Pods even
    when individual Pod IP addresses change.
  golden_answer_keywords: [Service, stable, Pod IP, endpoint]
  demonstrates_feature: hyde
  expected_baseline: fail
  expected_with_feature: pass
  expected_route: rag
  notes: "[development] Service discovery expressed without Kubernetes object names."

- id: q-103
  question: "I need every eligible node to run exactly one copy of a log collector. Which controller fits?"
  intent: rag
  golden_sources: [concepts__workloads__controllers__daemonset.html]
  acceptable_source_groups:
    - [concepts__workloads__controllers__daemonset.html, concepts__cluster-administration__logging.pdf]
  golden_answer: >
    Use a DaemonSet. It ensures that all eligible nodes, or the nodes selected by its scheduling
    constraints, run a copy of the Pod and creates or removes Pods as nodes join or leave.
  golden_answer_keywords: [DaemonSet, node, Pod]
  demonstrates_feature: hyde
  expected_baseline: fail
  expected_with_feature: pass
  expected_route: rag
  notes: "[development] Maps an operational requirement to DaemonSet."

- id: q-104
  question: "A batch calculation should run to completion and be retried if its Pod fails. What should own it?"
  intent: rag
  golden_sources: [concepts__workloads__controllers__job.pdf]
  golden_answer: >
    A Kubernetes Job should own the workload. A Job creates Pods for a finite task, tracks
    successful completions, and can retry failed Pods according to its restart and backoff policy.
  golden_answer_keywords: [Job, completion, retry, Pod]
  demonstrates_feature: hyde
  expected_baseline: fail
  expected_with_feature: pass
  expected_route: rag
  notes: "[development] Finite-work semantics without naming Job."

- id: q-105
