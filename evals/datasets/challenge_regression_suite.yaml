# MULTI-DOCUMENT SYNTHESIS
- id: q-109
  question: "Design the configuration boundary for an app that has ordinary settings plus a database password."
  intent: rag
  golden_sources: [concepts__configuration__configmap.html, concepts__configuration__secret.txt]
  golden_answer: >
    Store ordinary non-confidential settings in a ConfigMap and the database password in a Secret.
    Reference both from the Pod using environment variables or mounted volumes, restrict Secret
    access with RBAC, and avoid placing either value directly in the container image.
  golden_answer_keywords: [ConfigMap, Secret, password, RBAC]
  demonstrates_feature: hybrid
  expected_baseline: fail
  expected_with_feature: pass
  expected_route: rag
  notes: "[development] Requires a two-document confidentiality design."

- id: q-110
  question: "How do readiness checks and a Service cooperate during a rolling Deployment update?"
  intent: rag
  golden_sources: [tasks__configure-pod-container__configure-liveness-readiness-startup-probes.docx, concepts__services-networking__service.txt, concepts__workloads__controllers__deployment.txt]
  golden_answer: >
    The Deployment creates replacement Pods according to rolling-update limits. A readiness probe
    keeps each new Pod out of Service endpoints until it is ready, while the Service continues
    routing traffic to ready old and new Pods. This preserves availability during the rollout.
  golden_answer_keywords: [Deployment, readiness probe, Service, rolling update]
  demonstrates_feature: hybrid
  expected_baseline: fail
  expected_with_feature: pass
  expected_route: rag
  notes: "[development] Three-document availability synthesis."

- id: q-111
  question: "For a multi-tenant namespace, how would you combine aggregate consumption controls with per-container defaults?"
  intent: rag
  golden_sources: [concepts__policy__resource-quotas.txt, concepts__policy__limit-range.html]
  golden_answer: >
    Use ResourceQuota to cap aggregate namespace consumption or object counts, and use LimitRange
    to set per-container or per-Pod defaults, minimums, and maximums. Together they prevent one
    tenant from exhausting the namespace while ensuring individual workloads declare sane resources.
  golden_answer_keywords: [ResourceQuota, LimitRange, namespace, defaults]
  demonstrates_feature: hybrid
  expected_baseline: fail
  expected_with_feature: pass
  expected_route: rag
  notes: "[development] Requires correct separation of quota and limit responsibilities."

- id: q-112
  question: "Explain how a StatefulSet and persistent storage work together when a database Pod moves to another node."
  intent: rag
  golden_sources: [concepts__workloads__controllers__statefulset.docx, concepts__storage__persistent-volumes.pdf]
  golden_answer: >
    The StatefulSet preserves the database Pod's stable identity and uses a persistent volume claim
    for each replica. The PersistentVolume lifecycle is independent of the Pod, so a replacement
    Pod can reattach the same claim and recover the same data after scheduling on another node.
  golden_answer_keywords: [StatefulSet, PersistentVolumeClaim, stable identity, replacement Pod]
  demonstrates_feature: hybrid
  expected_baseline: fail
  expected_with_feature: pass
  expected_route: rag
  notes: "[development] Controller and storage lifecycle synthesis."

- id: q-113
  question: "How should least-privilege access and ServiceAccounts be combined for application Pods?"
  intent: rag
  golden_sources: [concepts__security__rbac-good-practices.pdf, tasks__configure-pod-container__configure-service-account.txt]
  golden_answer: >
    Create a dedicated ServiceAccount for the workload, bind only the minimal namespace-scoped RBAC
    permissions it needs, and set serviceAccountName in the Pod specification. Avoid broad roles,
    unnecessary cluster-wide bindings, and use of the default ServiceAccount.
  golden_answer_keywords: [ServiceAccount, serviceAccountName, RBAC, least privilege]
  demonstrates_feature: self_rag
  expected_baseline: fail
  expected_with_feature: pass
  expected_route: rag
  notes: "[development] Identity plus authorization synthesis."

- id: q-114
  question: "What is the relationship among a StorageClass, PersistentVolumeClaim, and PersistentVolume during dynamic provisioning?"
  intent: rag
  golden_sources: [concepts__storage__storage-classes.docx, concepts__storage__persistent-volumes.pdf]
  golden_answer: >
    A user creates a PersistentVolumeClaim that requests storage and optionally names a StorageClass.
    The StorageClass identifies a provisioner and parameters, which dynamically creates a matching
    PersistentVolume. Kubernetes then binds that volume to the claim for the Pod to consume.
  golden_answer_keywords: [StorageClass, PersistentVolumeClaim, PersistentVolume, provisioner]
  demonstrates_feature: self_rag
  expected_baseline: fail
  expected_with_feature: pass
  expected_route: rag
  notes: "[development] Tests complete dynamic-provisioning sequence."

- id: q-115
  question: "Why is an Ingress not a replacement for a Service when exposing HTTP applications?"
  intent: rag
  golden_sources: [concepts__services-networking__ingress.docx, concepts__services-networking__service.txt]
  golden_answer: >
    A Service supplies stable networking and endpoints for a group of Pods. An Ingress defines
