- id: q-210
  question: "Only frontend Pods may call the payments Pods on TCP 8443, and payments must not initiate other egress. What policy model expresses this?"
  intent: rag
  golden_sources: [concepts__services-networking__network-policies.html]
  golden_answer: >
    Apply NetworkPolicies enforced by a compatible network plugin. Select the payments Pods, allow
    ingress on TCP 8443 only from frontend Pods selected by labels, and apply an egress-isolating
    policy with only explicitly required exceptions. Policies are additive, so account for every
    policy selecting the Pods.
  golden_answer_keywords: [NetworkPolicy, ingress, egress, TCP 8443]
  demonstrates_feature: self_rag
  expected_baseline: fail
  expected_with_feature: pass
  expected_route: rag
  notes: "[final-holdout] Directional network isolation and additive-policy semantics."

- id: q-211
  question: "When a dynamically provisioned claim is deleted, what determines whether its storage is deleted or retained?"
  intent: rag
  golden_sources: [concepts__storage__persistent-volumes.pdf]
  golden_answer: >
    The bound PersistentVolume's reclaim policy determines what happens after the claim is released.
    For dynamically provisioned volumes, that policy is commonly inherited from the StorageClass.
    Delete removes the backing storage, while Retain preserves it for manual recovery or reuse.
  golden_answer_keywords: [reclaim policy, StorageClass, Delete, Retain]
  demonstrates_feature: hybrid
  expected_baseline: fail
  expected_with_feature: pass
  expected_route: rag
  notes: "[final-holdout] Corrected minimum sufficient evidence contract: the PersistentVolume source covers inherited reclaim policy, Delete, and Retain."

- id: q-212
  question: "If I edit a ConfigMap used by running Pods, when will the application observe the new value, and what differs between a mounted file and an environment variable?"
  intent: rag
  golden_sources: [concepts__configuration__configmap.html, tasks__configure-pod-container__configure-pod-configmap.html]
  golden_answer: >
    ConfigMap data projected into a mounted volume is updated eventually by kubelet synchronization,
    although an application may need to reread the file. Values injected as environment variables are
    fixed when the container starts, so existing containers require a restart or rollout to receive
    the changed value.
  golden_answer_keywords: [ConfigMap, mounted volume, environment variable, restart]
  demonstrates_feature: hybrid
  expected_baseline: fail
  expected_with_feature: pass
  expected_route: rag
  notes: "[final-holdout] Update propagation semantics across two consumption methods."
