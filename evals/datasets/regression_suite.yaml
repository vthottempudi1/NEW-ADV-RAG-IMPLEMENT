- id: q-201
  question: "A Java service takes four minutes to initialize. How do I stop Kubernetes from killing it during startup without hiding later deadlocks?"
  intent: rag
  golden_sources: [tasks__configure-pod-container__configure-liveness-readiness-startup-probes.docx]
  golden_answer: >
    Configure a startup probe with enough failure threshold and period to cover the four-minute
    initialization window. Kubernetes suppresses liveness and readiness checks until that startup
    probe succeeds. Keep a separate liveness probe afterward so later deadlocks still trigger a restart,
    and use readiness to control whether the Pod receives Service traffic.
  golden_answer_keywords: [startup probe, liveness probe, readiness, failure threshold]
  demonstrates_feature: self_rag
  expected_baseline: fail
  expected_with_feature: pass
  expected_route: rag
  notes: "[final-holdout] Slow-start lifecycle reasoning with three probe roles."

- id: q-202
  question: "We need a security agent on every GPU worker but nowhere else. Which controller and scheduling constraint should we use?"
  intent: rag
  golden_sources: [concepts__workloads__controllers__daemonset.html]
  golden_answer: >
    Use a DaemonSet so Kubernetes maintains one agent Pod on each eligible node. Add a node selector,
    node affinity, or equivalent node-label constraint matching GPU workers so other nodes are not
    eligible for the DaemonSet Pods.
  golden_answer_keywords: [DaemonSet, node selector, node affinity, GPU]
  demonstrates_feature: hyde
  expected_baseline: fail
  expected_with_feature: pass
  expected_route: rag
  notes: "[final-holdout] Combines node-wide ownership with placement restriction."

- id: q-203
  question: "A Pod needs one database credential and permission to read only that Secret. Describe the identity and authorization design."
  intent: rag
  golden_sources: [concepts__configuration__secret.txt, tasks__configure-pod-container__configure-service-account.txt, concepts__security__rbac-good-practices.pdf]
  golden_answer: >
    Store the credential in a Secret, assign the Pod a dedicated ServiceAccount using
    serviceAccountName, and bind a namespace-scoped Role that grants only the required get access to
    that specific Secret. Avoid broad Secret listing, cluster-wide bindings, and the default account.
  golden_answer_keywords: [Secret, ServiceAccount, Role, least privilege]
  demonstrates_feature: hybrid
  expected_baseline: fail
  expected_with_feature: pass
  expected_route: rag
  notes: "[final-holdout] Three-document workload identity and secret-access design."

- id: q-204
  question: "Trace an external HTTPS request from the cluster edge to a ready application Pod and name the Kubernetes abstractions involved."
  intent: rag
  golden_sources: [concepts__services-networking__ingress.docx, concepts__services-networking__service.txt, tasks__configure-pod-container__configure-liveness-readiness-startup-probes.docx]
  golden_answer: >
    An Ingress controller evaluates the Ingress HTTPS routing rule and forwards the request to a
    Service. The Service provides stable discovery and routes to its current endpoints. Readiness
    probes determine which Pods are ready and therefore eligible to receive Service traffic.
  golden_answer_keywords: [Ingress controller, Service, endpoints, readiness probe]
  demonstrates_feature: hybrid
  expected_baseline: fail
  expected_with_feature: pass
  expected_route: rag
  notes: "[final-holdout] End-to-end networking path across three resources."

- id: q-205
  question: "A critical Pod is pending because every node is full. Under what condition can priority help, and what can happen to lower-priority Pods?"
  intent: rag
  golden_sources: [concepts__scheduling-eviction__pod-priority-preemption.html]
  golden_answer: >
    If the scheduler cannot place the high-priority Pod, it can evaluate whether removing lower-priority
    Pods from a suitable node would make the Pod schedulable. It may nominate that node and preempt
    lower-priority Pods, subject to scheduling constraints and preemption rules; priority does not
    create capacity when no feasible placement can be made.
  golden_answer_keywords: [priority, scheduler, preemption, lower-priority Pods]
  demonstrates_feature: rerank
  expected_baseline: fail
  expected_with_feature: pass
  expected_route: rag
  notes: "[final-holdout] Corrected minimum sufficient evidence contract: the preemption source covers feasibility and lower-priority Pod eviction."

