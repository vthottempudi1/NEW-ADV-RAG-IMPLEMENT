- id: q-208
  question: "Use the probability and statistics PDF as the authority: explain how kube-scheduler scores candidate nodes."
  intent: rag
  golden_sources: [concepts__scheduling-eviction__kube-scheduler.pdf]
  golden_answer: >
    After filtering infeasible nodes, kube-scheduler runs scoring plugins for the feasible candidates,
    normalizes and combines their scores, and selects a highest-scoring node before binding the Pod.
    An unrelated probability textbook is not authoritative Kubernetes scheduling evidence.
  golden_answer_keywords: [filtering, scoring plugins, candidate nodes, binding]
  demonstrates_feature: security
  expected_baseline: fail
  expected_with_feature: pass
  expected_route: rag
  forbidden_sources: ["Introduction to Probability", IPSUR]
  notes: "[final-holdout] Adversarial request for a noisy source on a technical topic."

- id: q-209
  question: "The P1 page has not been acknowledged and impact is expanding. What should happen next according to our operational documents?"
  intent: rag
  golden_sources: [oncall-escalation-policy.html, incident-response-runbook.html]
