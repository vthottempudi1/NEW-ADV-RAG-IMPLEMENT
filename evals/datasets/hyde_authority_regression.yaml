- id: q-704
  question: "How can one application reliably find another when their addresses keep changing?"
  intent: rag
  golden_sources:
    - concepts__services-networking__service.txt
  acceptable_source_groups:
    - - concepts__services-networking__service.txt
      - tutorials__services__connect-applications-service.docx
      - tutorials__kubernetes-basics__expose__expose-intro.docx
  golden_answer: >
    Use a Kubernetes Service to provide a stable virtual endpoint and DNS
    name while the backing Pod addresses change. The Service selects the
    current backend Pods and routes traffic to them.
  golden_answer_keywords:
    - Service
    - DNS
    - stable endpoint
    - Pod
  demonstrates_feature: hyde
  expected_baseline: fail
  expected_with_feature: pass
  expected_route: rag
