- id: q-703
  question: "How can my application keep its data after it is restarted or moved to another machine?"
  intent: rag
  golden_sources:
    - concepts__storage__persistent-volumes.pdf
    - concepts__storage__storage-classes.docx
  acceptable_source_groups:
    - - concepts__storage__persistent-volumes.pdf
    - - concepts__storage__storage-classes.docx
  golden_answer: >
    Store the application data in a PersistentVolume and access it through a
    PersistentVolumeClaim rather than relying on the container filesystem.
    A StorageClass can provide dynamic volume provisioning where supported.
  golden_answer_keywords:
    - PersistentVolume
    - PersistentVolumeClaim
    - StorageClass
    - persistent
  demonstrates_feature: hyde
  expected_baseline: fail
  expected_with_feature: pass
  expected_route: rag
  forbidden_sources:
