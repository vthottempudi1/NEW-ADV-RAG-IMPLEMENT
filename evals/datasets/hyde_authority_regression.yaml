- id: q-701
  question: "How can I keep my application running when one server goes down?"
  intent: rag
  golden_sources:
    - concepts__workloads__controllers__deployment.txt
  acceptable_source_groups:
    - - concepts__workloads__controllers__deployment.txt
      - tutorials__kubernetes-basics__deploy-app__deploy-intro.txt
      - concepts__overview__what-is-kubernetes.docx
  golden_answer: >
    Use a Kubernetes Deployment with multiple replicas. If a node or
    container fails, Kubernetes can replace or reschedule Pods so the
    application remains available.
  golden_answer_keywords:
    - Deployment
    - replicas
    - availability
    - reschedule
  demonstrates_feature: hyde
  expected_baseline: fail
  expected_with_feature: pass
  expected_route: rag
  forbidden_sources:
    - Concurrent Programming for Scalable Web Architectures - Benjamin Erb - Thesis (April 2012) (vts_8082_11772).pdf
  notes: >
    [consumed-live-hyde] Lay-language availability query retrieved generic
    scalability research before authority-aware filtering.

- id: q-702
