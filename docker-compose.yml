name: new-adv-rag-implement

services:
  app:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    depends_on:
      - postgres
      - qdrant
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/adv_rag
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-new_adv_rag_documents}
    ports:
      - "8003:8000"

  streamlit:
    build:
      context: .
      dockerfile: infra/docker/streamlit.Dockerfile
    depends_on:
      - app
    ports:
      - "8501:8501"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: adv_rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6334:6333"
